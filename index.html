<!-- Load html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- Load jsPDF for PDF option -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<div class="dl-row">
  <button class="dl-btn" id="dl-png" onclick="downloadPNG()">
    ⬇ DOWNLOAD PNG (HIGH QUALITY)
  </button>
  <button class="dl-btn dl-pdf" id="dl-pdf" onclick="downloadPDF()">
    📄 SAVE AS PDF
  </button>
</div>
<p class="hint">1080×1350px · Instagram portrait · Print quality</p>

.dl-row {
  width: 580px; max-width: 100%;
  display: flex; gap: 8px;
}
.dl-btn {
  flex: 1; background: #111; color: #fff;
  border: none; border-radius: 6px; padding: 14px 0;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 15px; letter-spacing: 2.5px; cursor: pointer;
  transition: background 0.2s;
}
.dl-btn:hover { background: #333; }
.dl-btn.dl-pdf { background: #1a4a8a; }
.dl-btn.dl-pdf:hover { background: #2a6ad8; }

<script>
// HIGH QUALITY PNG — 1080×1350px true resolution
async function downloadPNG() {
  const btn = document.getElementById('dl-png');
  btn.textContent = '⏳ RENDERING HQ...';
  btn.disabled = true;
  const card = document.getElementById('post-card');
  
  // Calculate exact scale for 1080px output
  const targetWidth = 1080;
  const scale = targetWidth / card.offsetWidth;
  
  try {
    const canvas = await html2canvas(card, {
      scale: scale,           // exact 1080px
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      logging: false,
      imageTimeout: 0,        // no timeout for HQ
      width: card.offsetWidth,
      height: card.offsetHeight,
      windowWidth: card.offsetWidth,
      windowHeight: card.offsetHeight,
      x: 0, y: 0,
    });
    
    // Export as high quality PNG
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = 'anjaniya-post-HQ.png';
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
    }, 'image/png', 1.0);   // quality 1.0 = maximum
    
    btn.textContent = '✅ DOWNLOADED HQ!';
    setTimeout(() => {
      btn.textContent = '⬇ DOWNLOAD PNG (HIGH QUALITY)';
      btn.disabled = false;
    }, 2500);
  } catch(e) {
    btn.textContent = '❌ ERROR — TRY AGAIN';
    btn.disabled = false;
    console.error(e);
  }
}

// PDF EXPORT — Print quality
async function downloadPDF() {
  const btn = document.getElementById('dl-pdf');
  btn.textContent = '⏳ CREATING PDF...';
  btn.disabled = true;
  const card = document.getElementById('post-card');
  
  try {
    const canvas = await html2canvas(card, {
      scale: 2,              // 2x for PDF clarity
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      logging: false,
      imageTimeout: 0,
      width: card.offsetWidth,
      height: card.offsetHeight,
    });
    
    const imgData = canvas.toDataURL('image/png', 1.0);
    const { jsPDF } = window.jspdf;
    
    // Instagram 4:5 ratio in mm
    const pdf = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: [108, 135],    // 4:5 ratio in cm
    });
    
    pdf.addImage(imgData, 'PNG', 0, 0, 108, 135);
    pdf.save('anjaniya-post.pdf');
    
    btn.textContent = '✅ PDF SAVED!';
    setTimeout(() => {
      btn.textContent = '📄 SAVE AS PDF';
      btn.disabled = false;
    }, 2500);
  } catch(e) {
    btn.textContent = '❌ ERROR — TRY AGAIN';
    btn.disabled = false;
  }
}
</script>

      <!-- System Console Logs -->
      <div
        id="outputConsole"
        class="hidden bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-400 space-y-2 max-h-48 overflow-y-auto">
        <div
          class="text-cyan-400 font-bold border-b border-slate-800 pb-1 mb-2 flex justify-between items-center">
          <span>API Compilation status</span>
          <span
            id="consoleStatus"
            class="text-[10px] bg-slate-900 px-2 py-0.5 rounded text-amber-400"
            >Processing</span
          >
        </div>
        <div id="logFixedPrompt"></div>
        <div id="logUserInput"></div>
        <div id="logImageInput"></div>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="text-center p-4 text-xs text-slate-600 border-t border-t-slate-900 bg-slate-950/20">
      Bundles your prompt assets into the LLM context frame and creates an
      immediate runtime render tab.
    </footer>

    <!-- Frontend Core Script Engine -->
    <script>
      // --- 1. CONFIGURATION: INSERT YOUR GEMINI API KEY HERE ---
      const GEMINI_API_KEY = "AIzaSyBFQNtsAkUdU2V5DAVfY5h4gfIgqSHCJGo";
      const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;

      const imageInput = document.getElementById("imageInput");
      const imagePreviewContainer = document.getElementById(
        "imagePreviewContainer",
      );
      const imagePreview = document.getElementById("imagePreview");
      const removeImageBtn = document.getElementById("removeImageBtn");
      const userInput = document.getElementById("userInput");
      const fixedPrompt = document.getElementById("fixedPrompt");
      const generateBtn = document.getElementById("generateBtn");
      const outputConsole = document.getElementById("outputConsole");
      const consoleStatus = document.getElementById("consoleStatus");

      let base64ImageString = "No image payload attached";

      // Handle Image Attachment UI previews
      imageInput.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            imagePreview.src = e.target.result;
            base64ImageString = e.target.result;
            imagePreviewContainer.classList.remove("hidden");
          };
          reader.readAsDataURL(file);
        }
      });

      // Detach Image Action
      removeImageBtn.addEventListener("click", function () {
        imageInput.value = "";
        base64ImageString = "No image payload attached";
        imagePreviewContainer.classList.add("hidden");
        imagePreview.src = "#";
      });

      // Core App Logic: Run combined payload against live Gemini API endpoint
      generateBtn.addEventListener("click", async function () {
        const textValue = userInput.value.trim();
        const systemTemplate = fixedPrompt.value.trim();

        if (!textValue && base64ImageString === "No image payload attached") {
          alert(
            "Please add either text instructions or an image before running compilation.",
          );
          return;
        }

        if (GEMINI_API_KEY === "AIzaSyBFQNtsAkUdU2V5DAVfY5h4gfIgqSHCJGo") {
          alert(
            "Please open the file script and configure your real 'GEMINI_API_KEY' variable first.",
          );
          return;
        }

        // Reset and show status console logs
        outputConsole.classList.remove("hidden");
        consoleStatus.className =
          "text-[10px] bg-slate-900 px-2 py-0.5 rounded text-amber-400";
        consoleStatus.innerText = "Processing";

        document.getElementById("logFixedPrompt").innerText =
          `[SYSTEM PROMPT CONFIG LOADEDED]`;
        document.getElementById("logUserInput").innerText =
          `[USER REQUEST SENT]: "${textValue || "Image Context Only"}"`;
        document.getElementById("logImageInput").innerText =
          `[IMAGE LOAD STATUS]: ${base64ImageString === "No image payload attached" ? "No asset uploaded" : "Base64 Byte stream prepared..."}`;

        try {
          // Prepare API Structure Data Array
          const parts = [];

          // Mix system prompt conditions with user instructions explicitly
          const combinedPromptText = `${systemTemplate}\n\n[User Requirement Layout Request]:\n${textValue}`;
          parts.push({ text: combinedPromptText });

          // Attach base64 image data structures if present
          if (base64ImageString !== "No image payload attached") {
            const [meta, rawData] = base64ImageString.split(",");
            const mimeType = meta.match(/:(.*?);/)[1];

            parts.push({
              inlineData: {
                mimeType: mimeType,
                data: rawData,
              },
            });
          }

          // Fire async network request to Google Cloud servers
          const response = await fetch(GEMINI_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: parts }] }),
          });

          if (!response.ok)
            throw new Error(`HTTP Error Status: ${response.status}`);

          const data = await response.json();
          let generatedHTMLOutput = data.candidates[0].content.parts[0].text;

          // Strip down backtick markdown fences structural faults if returned by accident
          generatedHTMLOutput = generatedHTMLOutput
            .replace(/```html/gi, "")
            .replace(/```/g, "")
            .trim();

          // Update console tracker UI to success status
          consoleStatus.className =
            "text-[10px] bg-slate-900 px-2 py-0.5 rounded text-emerald-400";
          consoleStatus.innerText = "Success";

          // Open empty browser tab instance and stream compiled engine output directly
          const newTab = window.open();
          newTab.document.open();
          newTab.document.write(generatedHTMLOutput);
          newTab.document.close();
        } catch (error) {
          console.error("API Engine Compilation Fault:", error);
          consoleStatus.className =
            "text-[10px] bg-slate-900 px-2 py-0.5 rounded text-rose-400";
          consoleStatus.innerText = "Error Failed";
          alert(
            "Failed to build page. Please check your network context logs or verify your Gemini key is active.",
          );
        }
      });
    </script>
  </body>
</html>
